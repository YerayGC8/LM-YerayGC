<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Propuesto</title>
</head>

<body>
    <form action="validar.php" method="get">
        <fieldset>
            <legend>Para datos personales</legend>
            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" maxlength="9" size="9" placeholder="9 números" pattern="[0-9]" />
            <br>
            <label for="email">Correo electrónico</label>
            <input type="text" id="email" name="email" maxlength="50" size="50" placeholder="El formato correcto es nombre+@+servidor de correo" autocomplete="on" />
        </fieldset>
        <fieldset>
            <legend>Para valores numéricos</legend>
            <label for="personas">Número de personas</label>
            <input type="number" id="personas" name="personas" min="1" max="20" step="1" value="1" />
            <br>
            <label for="puntuacion">Desplace la barra para indicar puntuación (De 1 a 10)</label>
            <input type="range" id="puntuacion" name="puntuacion" min="1" max="10" step="1" value="1" />
        </fieldset>
        <fieldset>
            <legend>URL y búsqueda</legend>
            <label for="url">URL del sitio</label>
            <input type="url" id="url" name="url" />
            <br>
            <label for="busqueda">¿Qué te interesa buscar?</label>
            <input type="text" id="busqueda" name="busqueda" />
        </fieldset>
        <fieldset>
            <legend>Otros tipos</legend>
            <label for="color">Color</label>
            <input type="color" />
        </fieldset>
        <fieldset>
            <legend>Para fechas</legend>
            <label for="dia">Seleccione un día (hasta fin de año)</label>
            <input type="date" max="2026-12-31" />
            <br>
            <label for="hora">Seleccione una hora</label>
            <input type="time" />
            <br>
            <label for="mes">Seleccione un mes</label>
            <input type="month" />
            <br>
            <label for="semana">Seleccione una semana</label>
            <input type="week" />
            <br>
            <label for="fechayhora"> Seleccione fecha y hora</label>
            <input type="datetime-local" />
        </fieldset>
    </form>
</body>

</html>
